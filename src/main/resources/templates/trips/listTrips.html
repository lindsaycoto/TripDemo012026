<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TripApp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header th:insert="~{fragments/menu :: menu-principal}"></header>

<div class="container mt-5 pt-4">

    <a th:href="@{/trips/create}" class="btn btn-primary mb-3">
        Nuevo
    </a>

    <div th:if="${msg != null}" class="alert alert-success" th:text="${msg}" role="alert"></div>

    <table class="table table-hover">

        <thead class="table-light">
            <tr>
                <th>Categoría</th>
                <th>Nombre</th>
                <th>Fecha Publicación</th>
                <th>Estatus</th>
                <th>Destacada</th>
                <th>Editar/Borrar</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="trip : ${trips}">
                <td th:text="${trip.categoria != null ? trip.categoria.nombre : 'Sin categoría'}"></td>
                <td th:text="${trip.nombre}"></td>
                <td th:text="${trip.fecha}"></td>
                <td>
                    <span class="badge bg-success" th:text="${trip.estatus}"></span>
                </td>
                <td>
                    <span th:if="${trip.destacado == 1}" class="badge bg-success">SI</span>
                    <span th:unless="${trip.destacado == 1}" class="badge bg-secondary">NO</span>
                </td>
                <td>
                    <a th:href="@{/trips/edit/{id}(id=${trip.id})}" 
                       class="btn btn-success btn-sm">
                        ✏
                    </a>

                    <a th:href="@{/trips/delete/{id}(id=${trip.id})}" 
                       onclick="return confirm('¿Estas seguro?')"
                       class="btn btn-danger btn-sm">
                        🗑
                    </a>
                </td>
            </tr>
        </tbody>

    </table>

</div>

<footer th:insert="~{fragments/footer :: pie-pagina}" class="footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
